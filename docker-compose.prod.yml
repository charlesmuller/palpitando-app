version: '3.8'

# =============================================================
# PALPITANDO - Produção (VPS)
# Uso: docker compose -f docker-compose.prod.yml up -d
# =============================================================

networks:
  palpitando_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: palpitando_app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=production
    depends_on:
      - mysql
      - redis
    networks:
      - palpitando_net

  nginx:
    image: nginx:1.25-alpine
    container_name: palpitando_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      # SSL (Let's Encrypt via Certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - palpitando_net

  mysql:
    image: mysql:8.0
    container_name: palpitando_mysql
    restart: always
    # Em produção: NÃO expor porta externamente
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - palpitando_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PMA em produção: protegido por senha (acesso restrito)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: palpitando_pma
    restart: always
    # Em produção: acesso APENAS via proxy nginx com autenticação básica
    expose:
      - "80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_URL:-https://seudominio.com/pma/}
    depends_on:
      - mysql
    networks:
      - palpitando_net

  redis:
    image: redis:7-alpine
    container_name: palpitando_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - palpitando_net
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
