server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # -----------------------------------------------------------
    # Segurança - Headers
    # -----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # -----------------------------------------------------------
    # Bloqueios de segurança
    # -----------------------------------------------------------

    # Bloqueia acesso a arquivos ocultos (.env, .git, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia acesso direto a arquivos sensíveis
    location ~* \.(env|log|sql|sh|bak|orig)$ {
        deny all;
    }

    # Bloqueia scanners comuns
    location ~* (wp-admin|wp-login|xmlrpc|phpmyadmin/setup) {
        deny all;
    }

    # -----------------------------------------------------------
    # Assets estáticos - cache agressivo
    # -----------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -----------------------------------------------------------
    # Laravel - roteamento principal
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------
    # PHP-FPM
    # -----------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # -----------------------------------------------------------
    # Limites de tamanho
    # -----------------------------------------------------------
    client_max_body_size 32M;
}
