version: '3.8'

networks:
  palpitando_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1364806413
        GID: 1364800513
    container_name: palpitando_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - mysql
      - redis
    networks:
      - palpitando_net

  nginx:
    image: nginx:1.25-alpine
    container_name: palpitando_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - palpitando_net

  mysql:
    image: mysql:8.0
    container_name: palpitando_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: palpitando
      MYSQL_USER: palpitando_user
      MYSQL_PASSWORD: palpitando_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - palpitando_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: palpitando_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret
    networks:
      - palpitando_net

  redis:
    image: redis:7-alpine
    container_name: palpitando_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - palpitando_net